services:
  - type: web
    name: wathaiqi-health-release
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/wathaiqihealth/Health-Credential-Hub.git
    branch: main
    # Keep this identical to the reviewed command on the live Node service.
    # Development dependencies are present only while building; the deployed
    # API bundle is pruned to production dependencies under release/api.
    buildCommand: >-
      set -eu; export NODE_ENV=development; unset NODE_EXTRA_CA_CERTS; rm -rf release; mkdir -p release; corepack enable; corepack prepare pnpm@11.19.0 --activate; pnpm install --frozen-lockfile; pnpm run build:production; pnpm --filter @workspace/api-server deploy --prod --legacy release/api; mkdir -p release/api/dist release/web release/migrations release/certs; cp -R artifacts/api-server/dist/. release/api/dist/; cp -R artifacts/health-docs/dist/public/. release/web/; cp -R lib/db/migrations/. release/migrations/; cp config/supabase-prod-ca-2021.crt release/certs/supabase-prod-ca-2021.crt; node release/api/dist/check-pdf-security.mjs
    startCommand: >-
      set -eu; cd release/api; export WEB_DIST_DIR="$PWD/../web"; export MIGRATIONS_DIR="$PWD/../migrations"; export NODE_EXTRA_CA_CERTS="$PWD/../certs/supabase-prod-ca-2021.crt"; exec node --enable-source-maps dist/index.mjs
    healthCheckPath: /api/readyz
    # The free plan has no isolated pre-deploy job. Keep deploys manual so the
    # reviewed migration command can finish before a new revision is released.
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: BIND_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # Render injects RENDER_GIT_COMMIT at runtime. The public health endpoints
      # expose it only after strict Git-SHA validation. Do not set a static
      # RELEASE_SHA here because it would become stale on a later manual deploy.
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_USER
        value: healthdocs_app
      - key: APP_DATABASE_ROLE
        value: healthdocs_app_dml
      - key: MIGRATOR_DATABASE_USER
        value: healthdocs_migrator
      - key: MIGRATOR_DATABASE_ROLE
        value: healthdocs_migrator_ddl
      - key: VERIFY_DATABASE_ROLE_BOUNDARY
        value: "true"
      - key: DATABASE_OWNERSHIP_MODE
        value: managed
      - key: DATABASE_BLOCKED_ROLES
        value: anon,authenticated,service_role
      - key: SESSION_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: PROTECTED_MFA_USER_ID
        value: "1"
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: PUBLIC_APP_URL
        sync: false
      - key: OBJECT_STORAGE_PROVIDER
        value: s3
      # Controlled acceptance permits bounded JPEG/PNG/PDF intake. The API
      # rebuilds images as metadata-free JPEGs and PDFs as flattened,
      # image-only documents before private persistence.
      - key: DOCUMENT_UPLOADS_ENABLED
        value: "true"
      - key: UPLOAD_SECURITY_PROVIDER
        value: raster-sanitizer
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: S3_OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: S3_OBJECT_STORAGE_REGION
        value: eu-central-1
      - key: S3_OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: S3_OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_ALERTS_DISABLED
        value: "0"
      # Resend is shared by invitations, password recovery, alerts, and the
      # employee activation email OTP. Both values remain server-only/operator
      # supplied; readiness fails closed until the sender domain is verified.
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTOMATION_OUTBOX_ENABLED
        value: "true"
      - key: AUTOMATION_FACILITY_ALLOWLIST
        value: "1"
      - key: AUTOMATION_WEBHOOK_ENABLED
        value: "false"
      - key: AUTOMATION_EMBEDDED_WORKER_ENABLED
        value: "false"

  # Render HTTP health checks do not apply to background workers. This narrow
  # web service runs only the durable outbox poller plus fixed health endpoints,
  # allowing Render and an external uptime monitor to restart it independently
  # from the public API. It does not serve the product UI or business data.
  - type: web
    name: wathaiqi-automation-worker
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/wathaiqihealth/Health-Credential-Hub.git
    branch: main
    # Build only the API/worker package; this service never serves the product
    # UI. The same frozen lockfile and production dependency pruning apply.
    buildCommand: >-
      set -eu; export NODE_ENV=development; unset NODE_EXTRA_CA_CERTS; rm -rf release; mkdir -p release; corepack enable; corepack prepare pnpm@11.19.0 --activate; pnpm install --frozen-lockfile; pnpm --filter @workspace/api-server run build; pnpm --filter @workspace/api-server deploy --prod --legacy release/api; mkdir -p release/api/dist release/certs; cp -R artifacts/api-server/dist/. release/api/dist/; cp config/supabase-prod-ca-2021.crt release/certs/supabase-prod-ca-2021.crt
    startCommand: >-
      set -eu; cd release/api; export NODE_EXTRA_CA_CERTS="$PWD/../certs/supabase-prod-ca-2021.crt"; exec node --enable-source-maps dist/automation-worker.mjs
    healthCheckPath: /readyz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: BIND_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MAX
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_USER
        value: healthdocs_app
      - key: APP_DATABASE_ROLE
        value: healthdocs_app_dml
      - key: MIGRATOR_DATABASE_USER
        value: healthdocs_migrator
      - key: MIGRATOR_DATABASE_ROLE
        value: healthdocs_migrator_ddl
      - key: VERIFY_DATABASE_ROLE_BOUNDARY
        value: "true"
      - key: DATABASE_OWNERSHIP_MODE
        value: managed
      - key: DATABASE_BLOCKED_ROLES
        value: anon,authenticated,service_role
      # Required by the shared production helper bundle; this is an integer
      # identifier only, not a session or MFA secret.
      - key: PROTECTED_MFA_USER_ID
        sync: false
      - key: AUTOMATION_WORKER_MODE
        value: continuous
      - key: AUTOMATION_OUTBOX_ENABLED
        value: "true"
      - key: AUTOMATION_WEBHOOK_ENABLED
        value: "true"
      - key: AUTOMATION_EMBEDDED_WORKER_ENABLED
        value: "false"
      - key: AUTOMATION_WEBHOOK_MODE
        value: SINGLE_CONTROLLER
      - key: AUTOMATION_FACILITY_ALLOWLIST
        value: "1"
      - key: AUTOMATION_WEBHOOK_URL
        value: https://wathaiqi-n8n.onrender.com/webhook/health-credential-events-v1
      - key: AUTOMATION_WEBHOOK_HOST_ALLOWLIST
        value: wathaiqi-n8n.onrender.com
      - key: AUTOMATION_WEBHOOK_SECRET
        sync: false
      # Independent pre-workflow gate consumed by n8n Header Auth. It must not
      # equal AUTOMATION_WEBHOOK_SECRET and is never mounted on the public API.
      - key: AUTOMATION_WEBHOOK_HEADER_AUTH_SECRET
        sync: false
