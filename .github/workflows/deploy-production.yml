name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to release the current main commit
        required: true
        type: string

concurrency:
  group: health-credential-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    # Fail closed while direct cloud uploads lack bounded ingress and malware
    # quarantine. Set this protected environment/repository variable only after
    # those controls and the restore drill receive an explicit security review.
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY' && vars.MANAGED_CLOUD_UPLOAD_SECURITY_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API clients
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated
          test -z "$(git status --porcelain --untracked-files=all -- lib/api-client-react/src/generated lib/api-zod/src/generated)"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build production application
        run: pnpm run build:production

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Build, migrate, deploy, and verify readiness
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'me-central2' }}
          SERVICE: ${{ vars.GCP_SERVICE || 'health-credential-hub' }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'healthdocs' }}
          BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT || 'healthdocs-builder' }}
          BUILD_SOURCE_BUCKET: ${{ vars.GCP_BUILD_SOURCE_BUCKET }}
          SMOKE_URL: ${{ vars.PUBLIC_APP_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash infra/gcp/release.sh
