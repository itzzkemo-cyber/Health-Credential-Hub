name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API clients
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build web application
        run: pnpm --filter @workspace/health-docs run build
        env:
          BASE_PATH: /health-docs/
          PORT: 4173

      - name: Build mockup application
        run: pnpm --filter @workspace/mockup-sandbox run build
        env:
          BASE_PATH: /
          PORT: 4174

      - name: Build Expo bundles
        run: pnpm --filter @workspace/mobile run build
        env:
          BASE_PATH: /
          EXPO_PUBLIC_DOMAIN: ci.invalid

