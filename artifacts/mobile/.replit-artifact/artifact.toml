kind = "mobile"
previewPath = "/"
title = "MedCreds – Health Credentials Manager"
description = "A cross-platform mobile app (iOS + Android) for managing and archiving health practitioners' credentials and documents. Features role-based access (Employee, Supervisor, Department Manager, Facility Manager), Arabic-first bilingual UI with RTL/LTR support, AI-assisted OCR certificate extraction, expiry tracking with smart alerts, compliance dashboards, QR verification, and secure document storage. Built with Expo for seamless multi-platform deployment."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
