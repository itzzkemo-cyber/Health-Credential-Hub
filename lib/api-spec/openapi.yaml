openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HealthDocs - Healthcare Credential Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: credentials
    description: Credential management
  - name: employees
    description: Employee management
  - name: departments
    description: Department management
  - name: notifications
    description: Notification management
  - name: audit
    description: Audit log operations
  - name: dashboard
    description: Dashboard and analytics
  - name: policies
    description: Credential requirement policies
  - name: reports
    description: Reports and exports

  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a controlled URL for private file upload
      description: |
        Returns a short-lived private upload capability. The client sends JSON
        metadata here, then uploads the file with every returned required
        header. Enabled document intake is restricted to server-mediated
        filesystem/S3 deployments and JPEG/PNG input of at most 8 MiB. The
        guarded same-origin endpoint validates the grant and byte count, then
        decodes and rebuilds the image as a metadata-free JPEG before the
        private object becomes durable. Each capability is scoped to a newly
        allocated object identifier and the authenticated caller; the server
        rejects a known pre-existing object and verifies the rebuilt bytes and
        integrity hash after write. PDF and provider-direct uploads are not
        accepted by this controlled-release flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Controlled upload capability generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Document uploads are disabled or the upload security processor is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/{uploadId}:
    delete:
      tags: [Storage]
      operationId: deleteUnlinkedUpload
      summary: Delete a caller-owned upload that is not linked to a credential
      description: |
        Deletes a private upload only when the authenticated caller owns its
        upload grant and no credential record, including a soft-deleted record,
        references the object. Missing, linked, and unauthorized uploads share
        the same 404 response so object existence and tenant ownership are not
        disclosed.
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      responses:
        "204":
          description: The unlinked private upload was deleted.
        "401":
          description: Not authenticated or the session is no longer valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Upload not found, not caller-owned, or linked to any credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to delete the unlinked upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves credential document files. Requires authentication; access is
        limited to the file owner and manager roles.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Object not found or not visible to the authenticated caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Check whether persistent dependencies are ready
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: A required persistent dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful; the browser session is issued only as an httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: Password correct but 2FA is enabled — complete the OTP challenge to get a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorPending"
        "401":
          description: Invalid credentials

  /facilities:
    get:
      operationId: getFacilities
      tags: [facilities]
      summary: List facilities visible to the authenticated account
      description: System administrators receive the global directory; every other role receives only its own facility.
      responses:
        "200":
          description: Facilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacilityOption"
        "401":
          description: Authentication required

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: >-
            Password changed. All other sessions are revoked and this browser
            receives a fresh httpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResult"
        "400":
          description: Current password invalid, new password too short, or password reuse rejected
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  code:
                    type: string
                    enum: [PASSWORD_REUSE_NOT_ALLOWED]
                  message:
                    type: string
                  messageAr:
                    type: string

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset email sent

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using an emailed reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated; the browser session is issued only as an httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: Password updated but 2FA is enabled — complete the OTP challenge to get a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorPending"
        "400":
          description: Invalid or expired token, or password too short

  /auth/accept-invitation:
    post:
      operationId: acceptEmployeeInvitation
      tags: [auth]
      summary: Activate an employee account from a single-use invitation
      description: >-
        Public invite-acceptance endpoint. The bearer token and employee-chosen
        password are the only accepted fields. Organization scope and profile
        data come from the administrator-issued invitation. A successful
        activation does not create a browser session; the employee signs in
        through the normal login flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptEmployeeInvitationInput"
      responses:
        "201":
          description: Employee account activated without issuing a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeInvitationAccepted"
        "400":
          description: Weak password or a generic invalid, expired, replayed, or revoked invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"
        "403":
          description: Browser request verification failed
        "429":
          description: Too many acceptance attempts from this client

  # Two-factor authentication (TOTP)
  /auth/totp/setup:
    post:
      operationId: totpSetup
      tags: [auth]
      summary: Begin enabling 2FA — returns the secret, QR image and a signed setup token (nothing persisted yet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpSetupInput"
      responses:
        "200":
          description: Pending enrollment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupData"
        "400":
          description: Two-factor authentication already enabled
        "403":
          description: Current-password step-up failed

  /auth/totp/verify-setup:
    post:
      operationId: totpVerifySetup
      tags: [auth]
      summary: Confirm the first OTP to activate 2FA and receive single-use backup codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpVerifySetupInput"
      responses:
        "200":
          description: 2FA activated; backup codes shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpActivation"
        "400":
          description: Invalid code, expired setup session, or already enabled

  /auth/totp/challenge:
    post:
      operationId: totpChallenge
      tags: [auth]
      summary: Exchange a pending 2FA challenge token plus an OTP or backup code for a full session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpChallengeInput"
      responses:
        "200":
          description: Second factor accepted; the browser session is issued only as an httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid code, expired challenge, or too many attempts

  /auth/totp/disable:
    delete:
      operationId: totpDisable
      tags: [auth]
      summary: Disable 2FA (requires current password AND a valid OTP or backup code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmInput"
      responses:
        "200":
          description: Two-factor authentication disabled
        "400":
          description: Wrong password, invalid code, or 2FA not enabled

  /auth/totp/regenerate-backup:
    post:
      operationId: totpRegenerateBackup
      tags: [auth]
      summary: Generate a fresh batch of backup codes, invalidating all previous ones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmInput"
      responses:
        "200":
          description: New backup codes shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpActivation"
        "400":
          description: Wrong password, invalid code, or 2FA not enabled

  /auth/totp/admin-disable:
    post:
      operationId: totpAdminDisable
      tags: [auth]
      summary: Admin recovery — disable 2FA for a lower-ranked account in scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpAdminDisableInput"
      responses:
        "200":
          description: Two-factor authentication disabled for the employee
        "400":
          description: 2FA not enabled for this account
        "403":
          description: Not an admin, or attempted self-disable through the recovery route
        "404":
          description: Employee not found, outside your scope, or equal/higher-ranked

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get role-based dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/compliance:
    get:
      operationId: getComplianceOverview
      tags: [dashboard]
      summary: Get compliance overview by department
      responses:
        "200":
          description: Compliance by department
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentCompliance"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # Credentials
  /credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: List self-owned or strictly lower-ranked in-scope credentials
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expiring_soon, expired, missing]
        - name: type
          in: query
          schema:
            type: string
        - name: employeeId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: departmentId
          in: query
          schema:
            type: ["number", "null"]
        - name: search
          in: query
          schema:
            type: string
        - name: isVerified
          in: query
          description: >-
            Filter verification state after tenant and role scoping and before
            pagination. Use false for the manager review queue.
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: List of credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialListResponse"

    post:
      operationId: createCredential
      tags: [credentials]
      summary: Create a self-owned or strictly lower-ranked in-scope credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"

  /credentials/expiring:
    get:
      operationId: getExpiringCredentials
      tags: [credentials]
      summary: Get credentials expiring within N days
      parameters:
        - name: days
          in: query
          schema:
            type: number
            default: 90
      responses:
        "200":
          description: Expiring credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"

  /credentials/missing:
    get:
      operationId: getMissingCredentials
      tags: [credentials]
      summary: Get missing required credentials
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: departmentId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Missing credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissingCredential"

  /credentials/ocr/readiness:
    get:
      operationId: getCredentialOcrReadiness
      tags: [credentials]
      summary: Check reviewed OCR availability for an in-scope employee facility
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Facility-scoped OCR availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrReadiness"
        "403":
          description: Employee is outside the caller scope

  /credentials/ocr:
    post:
      operationId: extractCredentialOcr
      tags: [credentials]
      summary: Extract credential data from the uploaded document using AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrInput"
      responses:
        "200":
          description: Extracted credential data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResult"
        "400":
          description: The stored document path is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "403":
          description: The employee or stored object is outside the caller scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "404":
          description: The stored document was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "422":
          description: The document type or size is unsupported for OCR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "429":
          description: The caller exceeded the OCR request limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "500":
          description: The private document could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "502":
          description: The approved OCR processor failed or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "503":
          description: OCR is disabled, misconfigured, or unavailable for the facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"

  /credentials/{id}:
    get:
      operationId: getCredential
      tags: [credentials]
      summary: Get a self-owned or strictly lower-ranked in-scope credential by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "404":
          description: Not found

    patch:
      operationId: updateCredential
      tags: [credentials]
      summary: Update a self-owned or strictly lower-ranked in-scope credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdate"
      responses:
        "200":
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "409":
          description: Credential changed after it was read; reload before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "428":
          description: Credential update is missing its expected record version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    delete:
      operationId: deleteCredential
      tags: [credentials]
      summary: Delete a self-owned or strictly lower-ranked in-scope credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /credentials/{id}/verify:
    get:
      operationId: verifyCredential
      tags: [credentials]
      summary: Public credential verification by QR token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public verification data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialVerification"

  /credentials/check-duplicate:
    post:
      operationId: checkDuplicate
      tags: [credentials]
      summary: Check for duplicate credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateCheckInput"
      responses:
        "200":
          description: Duplicate check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateCheckResult"

  # Employees
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: facilityId
          in: query
          description: Optional facility selector for system administrators.
          schema:
            type: number
        - name: departmentId
          in: query
          schema:
            type: ["number", "null"]
        - name: supervisorId
          in: query
          schema:
            type: ["number", "null"]
        - name: role
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: atRisk
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeWithStats"

    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/invitations:
    get:
      operationId: listEmployeeInvitations
      tags: [employees]
      summary: List active employee invitations in administrator scope
      description: >-
        Hospital administrators receive only active invitations in their own
        facility. System administrators may receive all active invitations or
        filter by facility. Results are capped at 200 and never include the
        stored token digest.
      parameters:
        - name: facilityId
          in: query
          description: Optional facility selector honored only for system administrators.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Active invitations in administrator scope
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/EmployeeInvitation"
        "400":
          description: Invalid facility filter
        "401":
          description: Authentication or session freshness failed
        "403":
          description: Administrator role required

    post:
      operationId: createEmployeeInvitation
      tags: [employees]
      summary: Send a single-use employee registration invitation
      description: >-
        Hospital and system administrators only. The server hardcodes the role
        to employee, derives and validates tenant scope, consumes a fresh
        password plus TOTP/backup-code step-up, stores only a SHA-256 token
        digest, and emails a 24-hour single-use link. The raw token is never
        returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeInvitationInput"
      responses:
        "201":
          description: Invitation persisted and delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeInvitationCreated"
        "400":
          description: Invalid profile or organization reference
        "401":
          description: Authentication or session freshness failed
        "403":
          description: Role, MFA enrollment, or administrator step-up failed
        "409":
          description: An account already exists for the normalized email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"
        "429":
          description: Too many invitation step-up attempts from this client
        "502":
          description: Provider delivery failed and the stored invitation was revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"
        "503":
          description: Email delivery or the public application URL is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"

  /employees/invitations/{id}:
    delete:
      operationId: revokeEmployeeInvitation
      tags: [employees]
      summary: Revoke an active employee invitation
      description: >-
        Hospital and system administrators only. Revalidates tenant scope and
        consumes a fresh current-password plus TOTP/backup-code step-up while
        holding row locks. Missing, expired, consumed, revoked, and out-of-scope
        invitations share the same not-found response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStepUpInput"
      responses:
        "204":
          description: Invitation revoked
        "400":
          description: Invalid request body
        "401":
          description: Authentication or session freshness failed
        "403":
          description: Administrator role, MFA enrollment, or step-up failed
        "404":
          description: Invitation is missing, terminal, expired, or outside administrator scope
        "429":
          description: Too many invitation step-up attempts from this client

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Employee with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "404":
          description: Not found

    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "409":
          description: Employee changed concurrently; reload before retrying

    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStepUpInput"
      responses:
        "204":
          description: Deleted
        "409":
          description: Employee changed concurrently; reload before retrying

  /employees/{id}/activate:
    post:
      operationId: activateEmployee
      tags: [employees]
      summary: Activate employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStepUpInput"
      responses:
        "200":
          description: Employee activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "409":
          description: Employee changed concurrently; reload before retrying

  /employees/{id}/deactivate:
    post:
      operationId: deactivateEmployee
      tags: [employees]
      summary: Deactivate employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStepUpInput"
      responses:
        "200":
          description: Employee deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "409":
          description: Employee changed concurrently; reload before retrying

  # Departments
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      parameters:
        - name: facilityId
          in: query
          description: Optional facility selector for system administrators. Other roles remain scoped to their own facility.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentWithStats"

    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get department by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentWithStats"

    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # Notifications
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadCount
      tags: [notifications]
      summary: Get unread notification count
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked read

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Marked read

  # Audit Logs
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
            minimum: 1
        - name: action
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  # Policies
  /policies:
    get:
      operationId: listPolicies
      tags: [policies]
      summary: List credential requirement policies
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialPolicy"

    post:
      operationId: createPolicy
      tags: [policies]
      summary: Create credential requirement policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPolicyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialPolicy"

  /policies/{id}:
    delete:
      operationId: deletePolicy
      tags: [policies]
      summary: Delete policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # Reports
  /reports/compliance:
    get:
      operationId: getComplianceReport
      tags: [reports]
      summary: Generate compliance report
      parameters:
        - name: facilityId
          in: query
          description: Optional facility selector for system administrators.
          schema:
            type: number
        - name: departmentId
          in: query
          schema:
            type: ["number", "null"]
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Compliance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceReport"

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: number
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          enum: [image/jpeg, image/png]
          description: JPEG or PNG input MIME type. Stored output is rebuilt as JPEG.
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, requiredHeaders]
      properties:
        uploadURL:
          type: string
          description: >-
            Short-lived PUT destination. This is either a presigned provider
            URL or a guarded same-origin API path, depending on the configured
            private-storage provider.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        requiredHeaders:
          type: object
          description: Headers that must be included verbatim in the PUT request.
          additionalProperties:
            type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    MessageEnvelope:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        emailDelivery:
          type: string
          enum: [configured, disabled, misconfigured]
        ocr:
          type: string
          enum: [configured, disabled, misconfigured]
      required: [status]
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        objectStorage:
          type: string
        documentUploads:
          type: string
          enum: [enabled, disabled]
        emailDelivery:
          type: string
          enum: [configured, disabled]
        ocr:
          type: string
          enum: [configured, disabled]
      required:
        [status, database, objectStorage, documentUploads, emailDelivery, ocr]

    # Auth
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    TwoFactorPending:
      type: object
      required: [pending2fa, challengeToken]
      properties:
        pending2fa:
          type: boolean
        challengeToken:
          type: string

    TotpSetupInput:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          format: password

    TotpSetupData:
      type: object
      required: [secret, otpauthUrl, qrDataUrl, setupToken]
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
        qrDataUrl:
          type: string
        setupToken:
          type: string

    TotpVerifySetupInput:
      type: object
      required: [setupToken, code]
      properties:
        setupToken:
          type: string
        code:
          type: string

    TotpActivation:
      type: object
      required: [backupCodes]
      properties:
        backupCodes:
          type: array
          items:
            type: string

    TotpChallengeInput:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
        code:
          type: string

    TotpConfirmInput:
      type: object
      required: [currentPassword, code]
      properties:
        currentPassword:
          type: string
        code:
          type: string

    AdminStepUpInput:
      type: object
      additionalProperties: false
      required: [currentPassword, code]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          description: Current password of the authenticated administrator.
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: Single-use TOTP or backup code for administrator step-up verification.

    TotpAdminDisableInput:
      type: object
      required: [userId, currentPassword, code]
      properties:
        userId:
          type: number
        currentPassword:
          type: string
        code:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ChangePasswordResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 12

    AcceptEmployeeInvitationInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          pattern: "^[0-9a-f]{64}$"
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024

    EmployeeInvitationAccepted:
      type: object
      required: [success, message, messageAr]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        messageAr:
          type: string

    InvitationError:
      type: object
      required: [code, message, messageAr]
      properties:
        code:
          type: string
        message:
          type: string
        messageAr:
          type: string

    EmployeeInvitation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          email,
          name,
          nameAr,
          jobTitle,
          jobTitleAr,
          employeeNumber,
          phone,
          facilityId,
          departmentId,
          supervisorId,
          expiresAt,
          createdAt,
        ]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        nameAr:
          type: string
        jobTitle:
          type: string
        jobTitleAr:
          type: string
        employeeNumber:
          type: string
        phone:
          type: ["string", "null"]
        facilityId:
          type: integer
        departmentId:
          type: ["integer", "null"]
        supervisorId:
          type: ["integer", "null"]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    FacilityOption:
      type: object
      required: [id, name, nameAr]
      properties:
        id:
          type: number
        name:
          type: string
        nameAr:
          type: string

    # User
    User:
      type: object
      required:
        [
          id,
          email,
          name,
          nameAr,
          role,
          facilityId,
          isActive,
          mustChangePassword,
          totpEnabled,
          createdAt,
        ]
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        nameAr:
          type: string
        role:
          type: string
          enum:
            [
              employee,
              supervisor,
              department_manager,
              hospital_admin,
              system_admin,
            ]
        departmentId:
          type: ["number", "null"]
        supervisorId:
          type: ["number", "null"]
        facilityId:
          type: number
        jobTitle:
          type: string
        jobTitleAr:
          type: string
        employeeNumber:
          type: string
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        totpEnabled:
          type: boolean
        createdAt:
          type: string

    # Credential
    Credential:
      type: object
      required:
        [
          id,
          employeeId,
          type,
          holderName,
          holderNameAr,
          issuerName,
          issuerNameAr,
          certificateNumber,
          issueDate,
          expiryDate,
          status,
          qrToken,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: number
        employeeId:
          type: integer
          minimum: 1
        employee:
          $ref: "#/components/schemas/EmployeeSummary"
        type:
          type: string
          enum:
            [
              BLS,
              ACLS,
              PALS,
              NRP,
              TNCC,
              TCRN,
              code_red,
              code_blue,
              fire_safety,
              infection_control,
              SCFHS_license,
              SCFHS_classification,
              malpractice_insurance,
              employment_id,
              passport,
              iqama,
              visa,
              driving_license,
              medical_license,
              custom,
            ]
        customTypeName:
          type: ["string", "null"]
        customTypeNameAr:
          type: ["string", "null"]
        holderName:
          type: string
        holderNameAr:
          type: string
        issuerName:
          type: string
        issuerNameAr:
          type: string
        certificateNumber:
          type: string
        issueDate:
          type: string
        expiryDate:
          type: string
        status:
          type: string
          enum: [active, expiring_soon, expired, missing]
        fileUrl:
          type: ["string", "null"]
        fileType:
          type: ["string", "null"]
          enum: [image, pdf, null]
        qrToken:
          type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
        verificationUrl:
          type: ["string", "null"]
        confidence:
          type: ["number", "null"]
        isVerified:
          type: boolean
        version:
          type: number
          minimum: 1
          multipleOf: 1
          description: Monotonic whole-number record version used for verification concurrency control.
        createdAt:
          type: string
        updatedAt:
          type: string

    CredentialInput:
      type: object
      required:
        [
          employeeId,
          type,
          holderName,
          holderNameAr,
          issuerName,
          issuerNameAr,
          certificateNumber,
          issueDate,
          expiryDate,
        ]
      properties:
        employeeId:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
            [
              BLS,
              ACLS,
              PALS,
              NRP,
              TNCC,
              TCRN,
              code_red,
              code_blue,
              fire_safety,
              infection_control,
              SCFHS_license,
              SCFHS_classification,
              malpractice_insurance,
              employment_id,
              passport,
              iqama,
              visa,
              driving_license,
              medical_license,
              custom,
            ]
        customTypeName:
          type: string
        customTypeNameAr:
          type: string
        holderName:
          type: string
        holderNameAr:
          type: string
        issuerName:
          type: string
        issuerNameAr:
          type: string
        certificateNumber:
          type: string
        issueDate:
          type: string
        expiryDate:
          type: string
        fileUrl:
          type: string
          description: >-
            Object storage path returned by the upload flow (starts with
            /objects/). Inline data: URLs are rejected.
        fileType:
          type: string
          enum: [image, pdf]
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        verificationUrl:
          type: string
        confidence:
          type: number

    CredentialUpdate:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: number
          minimum: 1
          multipleOf: 1
          description: Required whole-number version for every update; stale versions return HTTP 409.
        type:
          type: string
        customTypeName:
          type: string
        customTypeNameAr:
          type: string
        holderName:
          type: string
        holderNameAr:
          type: string
        issuerName:
          type: string
        issuerNameAr:
          type: string
        certificateNumber:
          type: string
        issueDate:
          type: string
        expiryDate:
          type: string
        fileUrl:
          type: string
          description: >-
            Object storage path returned by the upload flow (starts with
            /objects/). Inline data: URLs are rejected. Send an empty string
            to clear the stored file.
        fileType:
          type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        verificationUrl:
          type: string
        isVerified:
          type: boolean

    CredentialListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number

    CredentialVerification:
      type: object
      required:
        [type, issuerName, issueDate, expiryDate, status, verificationCode]
      properties:
        type:
          type: string
        issuerName:
          type: string
        issueDate:
          type: string
        expiryDate:
          type: string
        status:
          type: string
        verificationCode:
          type: string

    DuplicateCheckInput:
      type: object
      required: [employeeId, type, certificateNumber]
      properties:
        employeeId:
          type: integer
          minimum: 1
        type:
          type: string
        certificateNumber:
          type: string

    DuplicateCheckResult:
      type: object
      required: [isDuplicate]
      properties:
        isDuplicate:
          type: boolean
        existingCredential:
          $ref: "#/components/schemas/Credential"

    OcrInput:
      type: object
      required: [fileUrl, employeeId]
      properties:
        fileUrl:
          type: string
        employeeId:
          type: integer
          minimum: 1
        fileName:
          type: ["string", "null"]

    OcrReadiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [enabled, disabled, misconfigured]

    OcrResult:
      type: object
      required: [detectedType, confidence]
      properties:
        detectedType:
          type: string
        holderName:
          type: ["string", "null"]
        holderNameAr:
          type: ["string", "null"]
        issuerName:
          type: ["string", "null"]
        issuerNameAr:
          type: ["string", "null"]
        certificateNumber:
          type: ["string", "null"]
        issueDate:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        confidence:
          $ref: "#/components/schemas/OcrConfidence"

    OcrConfidence:
      type: object
      required: [overall, type, name, issuer, certNumber, issueDate, expiryDate]
      properties:
        overall:
          type: number
        type:
          type: number
        name:
          type: number
        issuer:
          type: number
        certNumber:
          type: number
        issueDate:
          type: number
        expiryDate:
          type: number

    MissingCredential:
      type: object
      required: [employeeId, employeeName, credentialType, required]
      properties:
        employeeId:
          type: integer
          minimum: 1
        employeeName:
          type: string
        employeeNameAr:
          type: string
        credentialType:
          type: string
        required:
          type: boolean

    # Employee
    EmployeeSummary:
      type: object
      required: [id, name, nameAr, jobTitle, jobTitleAr]
      properties:
        id:
          type: number
        name:
          type: string
        nameAr:
          type: string
        jobTitle:
          type: string
        jobTitleAr:
          type: string
        avatarUrl:
          type: ["string", "null"]

    Employee:
      type: object
      required: [id, name, nameAr, email, role, facilityId, isActive, createdAt]
      properties:
        totpEnabled:
          type: boolean
        id:
          type: number
        name:
          type: string
        nameAr:
          type: string
        email:
          type: string
        role:
          type: string
        departmentId:
          type: ["number", "null"]
        supervisorId:
          type: ["number", "null"]
        facilityId:
          type: number
        jobTitle:
          type: string
        jobTitleAr:
          type: string
        employeeNumber:
          type: string
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    EmployeeWithStats:
      allOf:
        - $ref: "#/components/schemas/Employee"
        - type: object
          properties:
            department:
              $ref: "#/components/schemas/DepartmentSummary"
            complianceRate:
              type: number
            totalCredentials:
              type: number
            expiredCount:
              type: number
            expiringCount:
              type: number
            missingCount:
              type: number
            isAtRisk:
              type: boolean

    EmployeeDetail:
      allOf:
        - $ref: "#/components/schemas/EmployeeWithStats"
        - type: object
          properties:
            credentials:
              type: array
              items:
                $ref: "#/components/schemas/Credential"
            missingCredentials:
              type: array
              items:
                type: string
            supervisor:
              $ref: "#/components/schemas/EmployeeSummary"

    EmployeeInput:
      type: object
      required:
        [
          name,
          nameAr,
          email,
          password,
          role,
          jobTitle,
          jobTitleAr,
          employeeNumber,
        ]
      properties:
        name:
          type: string
        nameAr:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 12
        role:
          type: string
        departmentId:
          type: ["number", "null"]
        supervisorId:
          type: ["number", "null"]
        jobTitle:
          type: string
        jobTitleAr:
          type: string
        employeeNumber:
          type: string
        phone:
          type: string
        facilityId:
          type: number
          description: Target facility; honored only for system administrators.
        currentPassword:
          type: string
          format: password
          description: Required with code when provisioning a manager role.
        code:
          type: string
          description: Required with currentPassword when provisioning a manager role; accepts TOTP or a backup code.

    CreateEmployeeInvitationInput:
      type: object
      additionalProperties: false
      required:
        [
          name,
          nameAr,
          email,
          jobTitle,
          jobTitleAr,
          employeeNumber,
          currentPassword,
          code,
        ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        nameAr:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        jobTitle:
          type: string
          minLength: 1
          maxLength: 200
        jobTitleAr:
          type: string
          minLength: 1
          maxLength: 200
        employeeNumber:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: ["string", "null"]
          maxLength: 50
        facilityId:
          type: ["integer", "null"]
          minimum: 1
          description: Optional target facility; honored only for system administrators.
        departmentId:
          type: ["integer", "null"]
          minimum: 1
        supervisorId:
          type: ["integer", "null"]
          minimum: 1
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: Single-use TOTP or backup code for administrator step-up.

    EmployeeInvitationCreated:
      type: object
      required: [status, message, messageAr]
      properties:
        status:
          type: string
          enum: [sent]
        message:
          type: string
        messageAr:
          type: string

    EmployeeUpdate:
      type: object
      properties:
        name:
          type: string
        nameAr:
          type: string
        role:
          type: string
        departmentId:
          type: ["number", "null"]
        supervisorId:
          type: ["number", "null"]
        jobTitle:
          type: string
        jobTitleAr:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        currentPassword:
          type: string
          format: password
          description: Required with code when role, departmentId, supervisorId, or isActive actually changes.
        code:
          type: string
          description: Required with currentPassword when role, departmentId, supervisorId, or isActive actually changes; accepts a single-use TOTP or backup code.

    # Department
    DepartmentSummary:
      type: object
      required: [id, name, nameAr]
      properties:
        id:
          type: number
        name:
          type: string
        nameAr:
          type: string

    Department:
      type: object
      required: [id, name, nameAr, facilityId, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        nameAr:
          type: string
        facilityId:
          type: number
        headId:
          type: ["number", "null"]
        createdAt:
          type: string

    DepartmentWithStats:
      allOf:
        - $ref: "#/components/schemas/Department"
        - type: object
          properties:
            employeeCount:
              type: number
            complianceRate:
              type: number
            expiredCount:
              type: number
            expiringCount:
              type: number

    DepartmentInput:
      type: object
      required: [name, nameAr]
      properties:
        name:
          type: string
        nameAr:
          type: string
        headId:
          type: ["number", "null"]

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
        nameAr:
          type: string
        headId:
          type: ["number", "null"]

    # Notifications
    Notification:
      type: object
      required:
        [
          id,
          userId,
          type,
          titleAr,
          titleEn,
          messageAr,
          messageEn,
          isRead,
          createdAt,
        ]
      properties:
        id:
          type: number
        userId:
          type: number
        type:
          type: string
          enum: [expiry_warning, expired, new_credential, system]
        titleAr:
          type: string
        titleEn:
          type: string
        messageAr:
          type: string
        messageEn:
          type: string
        credentialId:
          type: ["number", "null"]
        employeeId:
          type: [integer, "null"]
          minimum: 1
        isRead:
          type: boolean
        daysUntilExpiry:
          type: ["number", "null"]
        createdAt:
          type: string

    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: number

    # Audit Log
    AuditLog:
      type: object
      required: [id, userId, userName, action, target, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        userName:
          type: string
        userNameAr:
          type: string
        action:
          type: string
        actionAr:
          type: string
        target:
          type: string
        targetAr:
          type: string
        details:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    AuditLogListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number

    # Dashboard
    DashboardStats:
      type: object
      required:
        [
          totalCredentials,
          activeCredentials,
          expiringCredentials,
          expiredCredentials,
          missingCredentials,
          complianceRate,
          totalEmployees,
          atRiskEmployees,
        ]
      properties:
        totalCredentials:
          type: number
        activeCredentials:
          type: number
        expiringCredentials:
          type: number
        expiredCredentials:
          type: number
        missingCredentials:
          type: number
        complianceRate:
          type: number
        totalEmployees:
          type: number
        atRiskEmployees:
          type: number
        upcomingExpirations:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    DepartmentCompliance:
      type: object
      required:
        [
          departmentId,
          departmentName,
          departmentNameAr,
          complianceRate,
          employeeCount,
          expiredCount,
          expiringCount,
        ]
      properties:
        departmentId:
          type: number
        departmentName:
          type: string
        departmentNameAr:
          type: string
        complianceRate:
          type: number
        employeeCount:
          type: number
        expiredCount:
          type: number
        expiringCount:
          type: number

    ActivityItem:
      type: object
      required: [id, action, actor, target, createdAt]
      properties:
        id:
          type: number
        action:
          type: string
        actionAr:
          type: string
        actor:
          type: string
        actorAr:
          type: string
        target:
          type: string
        targetAr:
          type: string
        createdAt:
          type: string

    # Policies
    CredentialPolicy:
      type: object
      required: [id, credentialType, roles, isRequired, createdAt]
      properties:
        id:
          type: number
        credentialType:
          type: string
          enum:
            [
              BLS,
              ACLS,
              PALS,
              NRP,
              TNCC,
              TCRN,
              code_red,
              code_blue,
              fire_safety,
              infection_control,
              SCFHS_license,
              SCFHS_classification,
              malpractice_insurance,
              employment_id,
              passport,
              iqama,
              visa,
              driving_license,
              medical_license,
              custom,
            ]
        departmentId:
          type: ["number", "null"]
        roles:
          type: array
          items:
            type: string
            enum:
              [
                employee,
                supervisor,
                department_manager,
                hospital_admin,
                system_admin,
              ]
        isRequired:
          type: boolean
        createdAt:
          type: string

    CredentialPolicyInput:
      type: object
      required: [credentialType, roles, isRequired]
      properties:
        credentialType:
          type: string
          enum:
            [
              BLS,
              ACLS,
              PALS,
              NRP,
              TNCC,
              TCRN,
              code_red,
              code_blue,
              fire_safety,
              infection_control,
              SCFHS_license,
              SCFHS_classification,
              malpractice_insurance,
              employment_id,
              passport,
              iqama,
              visa,
              driving_license,
              medical_license,
              custom,
            ]
        departmentId:
          type: ["number", "null"]
        roles:
          type: array
          items:
            type: string
            enum:
              [
                employee,
                supervisor,
                department_manager,
                hospital_admin,
                system_admin,
              ]
        isRequired:
          type: boolean

    # Reports
    ComplianceReport:
      type: object
      required: [generatedAt, facilityName, overallComplianceRate, departments]
      properties:
        generatedAt:
          type: string
        facilityName:
          type: string
        overallComplianceRate:
          type: number
        departments:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentComplianceDetail"

    DepartmentComplianceDetail:
      type: object
      required: [departmentName, employeeCount, complianceRate, employees]
      properties:
        departmentName:
          type: string
        employeeCount:
          type: number
        complianceRate:
          type: number
        expiredCount:
          type: number
        expiringCount:
          type: number
        employees:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeComplianceSummary"

    EmployeeComplianceSummary:
      type: object
      required:
        [
          name,
          nameAr,
          employeeNumber,
          complianceRate,
          expiredCount,
          expiringCount,
          missingCount,
        ]
      properties:
        name:
          type: string
        nameAr:
          type: string
        employeeNumber:
          type: string
        complianceRate:
          type: number
        expiredCount:
          type: number
        expiringCount:
          type: number
        missingCount:
          type: number
