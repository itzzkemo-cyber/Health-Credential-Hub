components:
  schemas:
    ShiftType:
      type: object
      description: Facility-local Asia/Riyadh wall-clock times. End at or before start rolls into the next day; duration must be greater than zero and no more than 16 hours. This is not a general DST-aware timezone scheduler.
      additionalProperties: false
      required: [code, label, labelAr, startTime, endTime, requiredPerDay]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_-]{0,7}$" }
        label: { type: string, minLength: 1, maxLength: 80 }
        labelAr: { type: string, minLength: 1, maxLength: 80 }
        startTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        endTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        requiredPerDay: { type: integer, minimum: 0, maximum: 200 }
    ScheduleConstraints:
      type: object
      additionalProperties: false
      required: [minRestHours, maxConsecutiveDays, maxShiftsPerMonth]
      properties:
        minRestHours: { type: integer, minimum: 0, maximum: 24 }
        maxConsecutiveDays: { type: integer, minimum: 1, maximum: 31 }
        maxShiftsPerMonth: { type: integer, minimum: 1, maximum: 31 }
    ScheduleUnavailability:
      type: object
      additionalProperties: false
      required: [employeeId, date]
      properties:
        employeeId: { type: integer, minimum: 1 }
        date:
          { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])-[0-3][0-9]$" }
    ShiftAssignment:
      type: object
      additionalProperties: false
      required: [employeeId, date, shiftCode]
      properties:
        employeeId: { type: integer, minimum: 1 }
        date:
          { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])-[0-3][0-9]$" }
        shiftCode: { type: string, pattern: "^[A-Z][A-Z0-9_-]{0,7}$" }
    ScheduleShortage:
      type: object
      required: [date, shiftCode, required, assigned]
      properties:
        date: { type: string }
        shiftCode: { type: string }
        required: { type: integer }
        assigned: { type: integer }
    CreateScheduleRequest:
      type: object
      additionalProperties: false
      required:
        [title, month, employeeIds, shiftTypes, constraints, unavailability]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        month: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$" }
        employeeIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        shiftTypes:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: "#/components/schemas/ShiftType" }
        constraints: { $ref: "#/components/schemas/ScheduleConstraints" }
        unavailability:
          type: array
          maxItems: 6200
          items: { $ref: "#/components/schemas/ScheduleUnavailability" }
    ScheduleVersionBody:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    UpdateScheduleRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, assignments]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        assignments:
          type: array
          maxItems: 6200
          items: { $ref: "#/components/schemas/ShiftAssignment" }
    ScheduleSummary:
      type: object
      required:
        [
          id,
          title,
          month,
          status,
          version,
          employeeCount,
          shortageCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        month: { type: string }
        status: { type: string, enum: [draft, published, cancelled] }
        version: { type: integer }
        employeeCount: { type: integer }
        shortageCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Schedule:
      allOf:
        - { $ref: "#/components/schemas/ScheduleSummary" }
        - type: object
          required:
            [
              facilityId,
              employeeIds,
              shiftTypes,
              constraints,
              unavailability,
              assignments,
              shortages,
              warnings,
            ]
          properties:
            facilityId: { type: integer }
            employeeIds:
              type: array
              items: { type: integer }
            shiftTypes:
              type: array
              items: { $ref: "#/components/schemas/ShiftType" }
            constraints: { $ref: "#/components/schemas/ScheduleConstraints" }
            unavailability:
              type: array
              items: { $ref: "#/components/schemas/ScheduleUnavailability" }
            assignments:
              type: array
              items: { $ref: "#/components/schemas/ShiftAssignment" }
            shortages:
              type: array
              items: { $ref: "#/components/schemas/ScheduleShortage" }
            warnings:
              type: array
              items: { type: string }
    TeamScheduleParticipant:
      type: object
      additionalProperties: false
      required: [employeeId, name, nameAr]
      properties:
        employeeId: { type: integer, minimum: 1 }
        name: { type: string }
        nameAr: { type: string }
    TeamShiftType:
      type: object
      additionalProperties: false
      required: [code, label, labelAr, startTime, endTime]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_-]{0,7}$" }
        label: { type: string, minLength: 1, maxLength: 80 }
        labelAr: { type: string, minLength: 1, maxLength: 80 }
        startTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        endTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    TeamSchedule:
      type: object
      additionalProperties: false
      required:
        [scheduleId, title, month, shiftTypes, participants, assignments]
      properties:
        scheduleId: { type: integer }
        title: { type: string }
        month: { type: string }
        shiftTypes:
          type: array
          items: { $ref: "#/components/schemas/TeamShiftType" }
        participants:
          type: array
          items: { $ref: "#/components/schemas/TeamScheduleParticipant" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/ShiftAssignment" }
    MySchedule:
      type: object
      additionalProperties: false
      required: [scheduleId, title, month, shiftTypes, assignments]
      properties:
        scheduleId: { type: integer }
        title: { type: string }
        month: { type: string }
        shiftTypes:
          type: array
          items: { $ref: "#/components/schemas/TeamShiftType" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/ShiftAssignment" }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: number
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
          description: JPEG/PNG is rebuilt as JPEG; eligible PDF is rebuilt as an image-only PDF (at most 5 pages).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, requiredHeaders]
      properties:
        uploadURL:
          type: string
          description: >-
            Short-lived PUT destination. This is either a presigned provider
            URL or a guarded same-origin API path, depending on the configured
            private-storage provider.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        requiredHeaders:
          type: object
          description: Headers that must be included verbatim in the PUT request.
          additionalProperties:
            type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    MessageEnvelope:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        releaseSha:
          type: string
          minLength: 7
          maxLength: 40
          pattern: "^[0-9a-f]{7,40}$"
          description: Public Git commit identifier for the running release, when available.
        emailDelivery:
          type: string
          enum: [configured, disabled, misconfigured]
        invitationEmailOtp:
          type: string
          enum: [configured, disabled, misconfigured]
        ocr:
          type: string
          enum: [configured, disabled, misconfigured]
      required: [status]
    ReadinessStatus:
      type: object
      properties:
        status:
