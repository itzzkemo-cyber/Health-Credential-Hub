      required: [id, name, nameAr]
      properties:
        id:
          type: number
        name:
          type: string
        nameAr:
          type: string

    Department:
      type: object
      required: [id, name, nameAr, facilityId, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        nameAr:
          type: string
        facilityId:
          type: number
        headId:
          type: ["number", "null"]
        createdAt:
          type: string

    DepartmentWithStats:
      allOf:
        - $ref: "#/components/schemas/Department"
        - type: object
          properties:
            employeeCount:
              type: number
            complianceRate:
              type: number
            expiredCount:
              type: number
            expiringCount:
              type: number

    DepartmentInput:
      type: object
      required: [name, nameAr]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        nameAr:
          type: string
          minLength: 1
          maxLength: 120
        headId:
          type: ["number", "null"]

    BatchDepartmentInput:
      type: object
      additionalProperties: false
      required: [departments]
      properties:
        departments:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [name, nameAr]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 120
              nameAr:
                type: string
                minLength: 1
                maxLength: 120

    BatchDepartmentResult:
      type: object
      additionalProperties: false
      required: [created, skipped]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/Department"
        skipped:
          type: array
          items:
            type: string
            maxLength: 120

    DepartmentUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        nameAr:
          type: string
          minLength: 1
          maxLength: 120
        headId:
          type: ["number", "null"]

    DepartmentNameConflict:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          enum: [department_name_conflict]

    # Notifications
    Notification:
      type: object
      required:
        [
          id,
          userId,
          type,
          titleAr,
          titleEn,
          messageAr,
          messageEn,
          isRead,
          createdAt,
        ]
      properties:
        id:
          type: number
        userId:
          type: number
        type:
          type: string
          enum: [expiry_warning, expired, new_credential, system]
        titleAr:
          type: string
        titleEn:
          type: string
        messageAr:
          type: string
        messageEn:
          type: string
        credentialId:
          type: ["number", "null"]
        employeeId:
          type: [integer, "null"]
          minimum: 1
        isRead:
          type: boolean
        daysUntilExpiry:
          type: ["number", "null"]
        createdAt:
          type: string

    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: number

    # Audit Log
    AuditLog:
      type: object
      required: [id, userId, userName, action, target, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        userName:
          type: string
        userNameAr:
          type: string
        action:
          type: string
        actionAr:
          type: string
        target:
          type: string
        targetAr:
          type: string
        details:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    AuditLogListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number

    # Dashboard
    DashboardStats:
      type: object
      required:
        [
          totalCredentials,
          activeCredentials,
          expiringCredentials,
          expiredCredentials,
          missingCredentials,
          complianceRate,
          totalEmployees,
          atRiskEmployees,
        ]
      properties:
        totalCredentials:
          type: number
        activeCredentials:
          type: number
        expiringCredentials:
          type: number
        expiredCredentials:
          type: number
        missingCredentials:
          type: number
        complianceRate:
          type: number
        totalEmployees:
          type: number
        atRiskEmployees:
          type: number
        upcomingExpirations:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    DepartmentCompliance:
      type: object
      required:
        [
          departmentId,
          departmentName,
          departmentNameAr,
          complianceRate,
          employeeCount,
          expiredCount,
          expiringCount,
        ]
      properties:
        departmentId:
          type: number
        departmentName:
          type: string
        departmentNameAr:
          type: string
        complianceRate:
          type: number
        employeeCount:
          type: number
        expiredCount:
          type: number
        expiringCount:
          type: number

    ActivityItem:
      type: object
      required: [id, action, actor, target, createdAt]
      properties:
        id:
          type: number
        action:
          type: string
        actionAr:
          type: string
        actor:
          type: string
        actorAr:
          type: string
        target:
          type: string
        targetAr:
          type: string
        createdAt:
          type: string

    # Policies
    CredentialPolicy:
      type: object
      required: [id, credentialType, roles, isRequired, createdAt]
      properties:
        id:
          type: number
        credentialType:
          type: string
          enum:
            [
              BLS,
              ACLS,
              PALS,
              NRP,
              TNCC,
              TCRN,
              code_red,
              code_blue,
              fire_safety,
              infection_control,
              SCFHS_license,
              SCFHS_classification,
              malpractice_insurance,
              employment_id,
              passport,
              iqama,
              visa,
              driving_license,
              medical_license,
              custom,
            ]
        departmentId:
          type: ["number", "null"]
        roles:
          type: array
          items:
            type: string
            enum:
              [
                employee,
                supervisor,
                department_manager,
                hospital_admin,
                system_admin,
              ]
        isRequired:
          type: boolean
        createdAt:
          type: string

    CredentialPolicyInput:
      type: object
      required: [credentialType, roles, isRequired]
      properties:
        credentialType:
          type: string
          enum:
            [
              BLS,
              ACLS,
              PALS,
              NRP,
              TNCC,
              TCRN,
              code_red,
              code_blue,
              fire_safety,
              infection_control,
              SCFHS_license,
              SCFHS_classification,
              malpractice_insurance,
              employment_id,
              passport,
              iqama,
              visa,
              driving_license,
              medical_license,
              custom,
            ]
        departmentId:
          type: ["number", "null"]
        roles:
          type: array
          items:
            type: string
            enum:
              [
                employee,
                supervisor,
                department_manager,
                hospital_admin,
                system_admin,
              ]
        isRequired:
          type: boolean

    # Reports
    ComplianceReport:
      type: object
      required: [generatedAt, facilityName, overallComplianceRate, departments]
      properties:
        generatedAt:
          type: string
        facilityName:
          type: string
        overallComplianceRate:
          type: number
        departments:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentComplianceDetail"

    DepartmentComplianceDetail:
      type: object
      required: [departmentName, employeeCount, complianceRate, employees]
      properties:
        departmentName:
          type: string
        employeeCount:
          type: number
        complianceRate:
          type: number
        expiredCount:
          type: number
        expiringCount:
          type: number
        employees:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeComplianceSummary"

    EmployeeComplianceSummary:
      type: object
      required:
        [
          name,
          nameAr,
          employeeNumber,
          complianceRate,
          expiredCount,
          expiringCount,
          missingCount,
        ]
      properties:
        name:
          type: string
        nameAr:
          type: string
        employeeNumber:
          type: string
        complianceRate:
          type: number
        expiredCount:
          type: number
        expiringCount:
          type: number
        missingCount:
          type: number
