        objectStorage:
          type: string
        documentUploads:
          type: string
          enum: [enabled, disabled]
        emailDelivery:
          type: string
          enum: [configured, disabled]
        invitationEmailOtp:
          type: string
          enum: [configured, disabled]
        ocr:
