                $ref: "#/components/schemas/DuplicateCheckResult"

  # Employees
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: facilityId
          in: query
          description: Optional facility selector for system administrators.
          schema:
            type: number
        - name: departmentId
          in: query
          schema:
            type: ["number", "null"]
        - name: supervisorId
          in: query
          schema:
            type: ["number", "null"]
        - name: role
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: atRisk
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeWithStats"

    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/invitations:
    get:
      operationId: listEmployeeInvitations
      tags: [employees]
      summary: List active employee invitations in administrator scope
      description: >-
        Hospital administrators receive only active invitations in their own
        facility. System administrators may receive all active invitations or
        filter by facility. Results are capped at 200 and never include the
        stored token digest.
      parameters:
        - name: facilityId
          in: query
          description: Optional facility selector honored only for system administrators.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Active invitations in administrator scope
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/EmployeeInvitation"
        "400":
          description: Invalid facility filter
        "401":
          description: Authentication or session freshness failed
        "403":
          description: Administrator role required

    post:
      operationId: createEmployeeInvitation
      tags: [employees]
      summary: Send a single-use employee registration invitation
      description: >-
        Hospital and system administrators only. The server hardcodes the role
        to employee, derives and validates tenant scope, consumes a fresh
        password plus TOTP/backup-code step-up, stores only a SHA-256 token
        digest, and emails a 24-hour single-use link. The raw token is never
        returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeInvitationInput"
      responses:
        "201":
          description: Invitation persisted and delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeInvitationCreated"
        "400":
          description: Invalid profile or organization reference
        "401":
          description: Authentication or session freshness failed
        "403":
          description: Role, MFA enrollment, or administrator step-up failed
        "409":
          description: An account already exists for the normalized email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"
        "429":
          description: Too many invitation step-up attempts from this client
        "502":
          description: Provider delivery failed and the stored invitation was revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"
        "503":
          description: Email delivery or the public application URL is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"

  /employees/invitations/{id}:
    delete:
      operationId: revokeEmployeeInvitation
      tags: [employees]
      summary: Revoke an active employee invitation
      description: >-
        Hospital and system administrators only. Revalidates tenant scope and
        consumes a fresh current-password plus TOTP/backup-code step-up while
        holding row locks. Missing, expired, consumed, revoked, and out-of-scope
        invitations share the same not-found response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStepUpInput"
      responses:
        "204":
          description: Invitation revoked
        "400":
          description: Invalid request body
        "401":
          description: Authentication or session freshness failed
        "403":
          description: Administrator role, MFA enrollment, or step-up failed
        "404":
          description: Invitation is missing, terminal, expired, or outside administrator scope
        "429":
          description: Too many invitation step-up attempts from this client

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
