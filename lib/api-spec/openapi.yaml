openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HealthDocs - Healthcare Credential Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: credentials
    description: Credential management
  - name: employees
    description: Employee management
  - name: departments
    description: Department management
  - name: notifications
    description: Notification management
  - name: audit
    description: Audit log operations
  - name: dashboard
    description: Dashboard and analytics
  - name: policies
    description: Credential requirement policies
  - name: reports
    description: Reports and exports
  - name: schedules
    description: Scoped monthly employee shift scheduling

  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: List complete rosters within the manager's current scope
      description: Returns at most 100 schedules for the requested month (current month by default). A roster is visible only when every participant is in scope. Employees use /schedules/mine instead.
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: Scoped monthly schedules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleSummary" }
        "403":
          description: Manager role required
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: Generate and save a deterministic monthly draft
      description: Managers select active workforce accounts from one facility within their current scope, including their own clinical shifts. At most one non-cancelled roster may include an employee in a month. Infeasible coverage is returned explicitly as shortages. These configurable planning checks do not assert labor-law or clinical staffing compliance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleRequest" }
      responses:
        "201":
          description: Persisted draft, including coverage shortages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          description: Invalid configuration
        "403":
          description: Manager role or complete participant scope required
        "409":
          description: A participant already belongs to a roster in this month
  /schedules/mine:
    get:
      tags: [schedules]
      operationId: getMySchedules
      summary: Read only the caller's published assignments
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: Published own assignments only; excludes colleagues and unavailability
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MySchedule" }
  /schedules/team:
    get:
      tags: [schedules]
      operationId: getTeamSchedules
      summary: Read the caller's published team roster
      description: Returns the complete published roster shared by the caller and their active roster teammates in the same current facility. Published roster membership defines this team boundary. Teammate exposure is limited to display names and shift assignments. Drafts, cancelled rosters, availability constraints, edit metadata, inactive users, and cross-facility participants are never returned. A roster with any inactive or out-of-facility participant fails closed as invisible.
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: Complete published team assignments and participant display names only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamSchedule" }
  /schedules/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: Read a complete scoped roster
      responses:
        "200":
          description: Complete authorized roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404":
          description: Roster not found in current scope
    patch:
      tags: [schedules]
      operationId: updateSchedule
      summary: Validate and replace all assignments in a draft
      description: Rejects duplicate employee/day assignments, unknown shifts or employees, unavailable days, insufficient overnight rest, and configured work limits. A published roster is immutable. Adjacent saved rosters are considered for boundary rest and consecutive-day checks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateScheduleRequest" }
      responses:
        "200":
          description: Updated validated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          description: Invalid assignments
        "404":
          description: Roster not found in current scope
        "409":
          description: Stale version or published roster
        "428":
          description: expectedVersion is required
  /schedules/{id}/publish:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [schedules]
      operationId: publishSchedule
      summary: Publish a validated, fully covered draft
      description: Rechecks active participants, complete current manager scope, all configured constraints, adjacent rosters and coverage under transactional locks. Published assignments become visible to each participant separately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleVersionBody" }
      responses:
        "200":
          description: Published roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404":
          description: Roster not found in current scope
        "409":
          description: Stale version, invalid roster, coverage shortage or already published
        "428":
          description: expectedVersion is required
  /schedules/{id}/reopen:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [schedules]
      operationId: reopenSchedule
      summary: Withdraw a published roster into an editable draft
      description: Versioned and audited. Immediately removes the roster from employees' published views until republished.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleVersionBody" }
      responses:
        "200":
          description: Reopened draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404":
          description: Roster not found in current scope
        "409":
          description: Stale version or roster is not published
        "428":
          description: expectedVersion is required
  /schedules/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [schedules]
      operationId: cancelSchedule
      summary: Cancel a draft while preserving its history
      description: Releases monthly employee membership so a corrected draft can be created. Published rosters must be reopened first. Cancelled rosters remain available by ID to fully scoped managers but are excluded from monthly lists and employee views.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleVersionBody" }
      responses:
        "200":
          description: Cancelled roster with retained history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404":
          description: Roster not found in current scope
        "409":
          description: Stale version or roster is not a draft
        "428":
          description: expectedVersion is required
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a controlled URL for private file upload
      description: |
        Returns a short-lived private upload capability. The client sends JSON
        metadata here, then uploads the file with every returned required
        header. Enabled document intake is restricted to server-mediated
        filesystem/S3 deployments and JPEG/PNG/PDF input of at most 8 MiB. The
        guarded same-origin endpoint validates the grant and byte count, then
        decodes and rebuilds the image as a metadata-free JPEG before the
        private object becomes durable. Each capability is scoped to a newly
        allocated object identifier and the authenticated caller; the server
        rejects a known pre-existing object and verifies the rebuilt bytes and
        integrity hash after write. PDFs pass a separate bounded child process:
        at most 5 pages, no encryption, forms, digital signatures, embedded files,
        or active content. Pages are rasterized and rebuilt as an image-only PDF;
        selectable text, metadata, and interactive features are not preserved.
        Invalid, over-limit, or unprocessable PDFs fail closed. Provider-direct
        uploads are not accepted by this controlled-release flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Controlled upload capability generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Document uploads are disabled or the upload security processor is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/{uploadId}:
    delete:
      tags: [Storage]
      operationId: deleteUnlinkedUpload
      summary: Delete a caller-owned upload that is not linked to a credential
      description: |
        Deletes a private upload only when the authenticated caller owns its
        upload grant and no credential record, including a soft-deleted record,
        references the object. Missing, linked, and unauthorized uploads share
        the same 404 response so object existence and tenant ownership are not
        disclosed.
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      responses:
        "204":
          description: The unlinked private upload was deleted.
        "401":
          description: Not authenticated or the session is no longer valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Upload not found, not caller-owned, or linked to any credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to delete the unlinked upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves credential document files. Requires authentication; access is
        limited to the file owner and manager roles.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Object not found or not visible to the authenticated caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Check whether persistent dependencies are ready
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: A required persistent dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful; the browser session is issued only as an httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: Password correct but 2FA is enabled — complete the OTP challenge to get a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorPending"
        "401":
          description: Invalid credentials

  /facilities:
    get:
      operationId: getFacilities
      tags: [facilities]
      summary: List facilities visible to the authenticated account
      description: System administrators receive the global directory; every other role receives only its own facility.
      responses:
        "200":
          description: Facilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacilityOption"
        "401":
          description: Authentication required

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: >-
            Password changed. All other sessions are revoked and this browser
            receives a fresh httpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResult"
        "400":
          description: Current password invalid, new password too short, or password reuse rejected
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  code:
                    type: string
                    enum: [PASSWORD_REUSE_NOT_ALLOWED]
                  message:
                    type: string
                  messageAr:
                    type: string

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset email sent

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using an emailed reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated; the browser session is issued only as an httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: Password updated but 2FA is enabled — complete the OTP challenge to get a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorPending"
        "400":
          description: Invalid or expired token, or password too short

  /auth/invitation-email-otp/start:
    post:
      operationId: startInvitationEmailVerification
      tags: [auth]
      summary: Email an OTP for an employee invitation
      description: >-
        Public, rate-limited first step of employee activation. The supplied
        bearer token resolves the server-side invitation email; no recipient
        address is accepted from the caller. OTP state, send cooldowns, attempt
        budgets, and expiry are durable; only a secret-keyed HMAC is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInvitationEmailOtpInput"
      responses:
        "202":
          description: OTP dispatch accepted by the configured email provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpStarted"
        "400":
          description: Generic invalid, expired, replayed, or revoked invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"
        "409":
          description: An OTP dispatch or verification lease is active, or the current OTP was already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpError"
        "429":
          description: Durable invitation cooldown or send budget reached, or client rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpError"
        "502":
          description: Email provider rejected or failed the delivery request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpError"
        "503":
          description: Email OTP delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpError"

  /auth/accept-invitation:
    post:
      operationId: acceptEmployeeInvitation
      tags: [auth]
      summary: Activate an employee account from a single-use invitation
      description: >-
        Public invite-acceptance endpoint. The bearer token, emailed OTP, and
        employee-chosen password are the only accepted fields. Organization
        scope and profile data come from the
        administrator-issued invitation. The OTP is verified before the user
        row is created. A successful activation does not create a browser
        session; the employee signs in through the normal login flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptEmployeeInvitationInput"
      responses:
        "201":
          description: Employee account activated without issuing a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeInvitationAccepted"
        "400":
          description: Weak password, rejected OTP, or a generic invalid, expired, replayed, or revoked invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationError"
        "403":
          description: Browser request verification failed
        "409":
          description: Another verification attempt is currently in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpError"
        "429":
          description: Too many acceptance attempts from this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpError"
        "503":
          description: Email OTP delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOtpError"

  # Two-factor authentication (TOTP)
  /auth/totp/setup:
    post:
      operationId: totpSetup
      tags: [auth]
      summary: Begin enabling 2FA — returns the secret, QR image and a signed setup token (nothing persisted yet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpSetupInput"
      responses:
        "200":
          description: Pending enrollment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupData"
        "400":
          description: Two-factor authentication already enabled
        "403":
          description: Current-password step-up failed

  /auth/totp/verify-setup:
    post:
      operationId: totpVerifySetup
      tags: [auth]
      summary: Confirm the first OTP to activate 2FA and receive single-use backup codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpVerifySetupInput"
      responses:
        "200":
          description: 2FA activated; backup codes shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpActivation"
        "400":
          description: Invalid code, expired setup session, or already enabled

  /auth/totp/challenge:
    post:
      operationId: totpChallenge
      tags: [auth]
      summary: Exchange a pending 2FA challenge token plus an OTP or backup code for a full session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpChallengeInput"
      responses:
        "200":
          description: Second factor accepted; the browser session is issued only as an httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid code, expired challenge, or too many attempts

  /auth/totp/disable:
    delete:
      operationId: totpDisable
      tags: [auth]
      summary: Disable 2FA (requires current password AND a valid OTP or backup code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmInput"
      responses:
        "200":
          description: Two-factor authentication disabled
        "400":
          description: Wrong password, invalid code, or 2FA not enabled

  /auth/totp/regenerate-backup:
    post:
      operationId: totpRegenerateBackup
      tags: [auth]
      summary: Generate a fresh batch of backup codes, invalidating all previous ones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmInput"
      responses:
        "200":
          description: New backup codes shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpActivation"
        "400":
          description: Wrong password, invalid code, or 2FA not enabled

  /auth/totp/admin-disable:
    post:
      operationId: totpAdminDisable
      tags: [auth]
      summary: Admin recovery — disable 2FA for a lower-ranked account in scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpAdminDisableInput"
      responses:
        "200":
          description: Two-factor authentication disabled for the employee
        "400":
          description: 2FA not enabled for this account
        "403":
          description: Not an admin, or attempted self-disable through the recovery route
        "404":
          description: Employee not found, outside your scope, or equal/higher-ranked

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get role-based dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/compliance:
    get:
      operationId: getComplianceOverview
      tags: [dashboard]
      summary: Get compliance overview by department
      responses:
        "200":
          description: Compliance by department
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentCompliance"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # Credentials
  /credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: List self-owned or strictly lower-ranked in-scope credentials
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expiring_soon, expired, missing]
        - name: type
          in: query
          schema:
            type: string
        - name: employeeId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: departmentId
          in: query
          schema:
            type: ["number", "null"]
        - name: search
          in: query
          schema:
            type: string
        - name: isVerified
          in: query
          description: >-
            Filter verification state after tenant and role scoping and before
            pagination. Use false for the manager review queue.
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: List of credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialListResponse"

    post:
      operationId: createCredential
      tags: [credentials]
      summary: Create a self-owned or strictly lower-ranked in-scope credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"

  /credentials/expiring:
    get:
      operationId: getExpiringCredentials
      tags: [credentials]
      summary: Get credentials expiring within N days
      parameters:
        - name: days
          in: query
          schema:
            type: number
            default: 90
      responses:
        "200":
          description: Expiring credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"

  /credentials/missing:
    get:
      operationId: getMissingCredentials
      tags: [credentials]
      summary: Get missing required credentials
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: departmentId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Missing credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissingCredential"

  /credentials/ocr/readiness:
    get:
      operationId: getCredentialOcrReadiness
      tags: [credentials]
      summary: Check reviewed OCR availability for an in-scope employee facility
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Facility-scoped OCR availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrReadiness"
        "403":
          description: Employee is outside the caller scope

  /credentials/ocr:
    post:
      operationId: extractCredentialOcr
      tags: [credentials]
      summary: Extract credential data from the uploaded document using AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrInput"
      responses:
        "200":
          description: Extracted credential data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResult"
        "400":
          description: The stored document path is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "403":
          description: The employee or stored object is outside the caller scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "404":
          description: The stored document was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "422":
          description: The document type or size is unsupported for OCR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "429":
          description: The caller exceeded the OCR request limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "500":
          description: The private document could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "502":
          description: The approved OCR processor failed or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "503":
          description: OCR is disabled, misconfigured, or unavailable for the facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"

  /credentials/{id}:
    get:
      operationId: getCredential
      tags: [credentials]
      summary: Get a self-owned or strictly lower-ranked in-scope credential by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "404":
          description: Not found

    patch:
      operationId: updateCredential
      tags: [credentials]
      summary: Update a self-owned or strictly lower-ranked in-scope credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdate"
      responses:
        "200":
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "409":
          description: Credential changed after it was read; reload before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "428":
          description: Credential update is missing its expected record version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    delete:
      operationId: deleteCredential
      tags: [credentials]
      summary: Delete a self-owned or strictly lower-ranked in-scope credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /credentials/{id}/verify:
    get:
      operationId: verifyCredential
      tags: [credentials]
      summary: Public credential verification by QR token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public verification data
          content:
            application/json:
